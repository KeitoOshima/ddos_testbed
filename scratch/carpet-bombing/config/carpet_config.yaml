global_settings:
  capture:
    pcap_prefix: CARPET

  attack:
    burst_duration_s: 10.0
    target_switch_duration_s: 5.0

    attack_vectors:
      - type: tcp_syn_flooding
        data_rate: 1Mbps

    carpet_bombing:
      target_prefix: 1.178.112.0/20
      candidate_targets: 1024
      simultaneous_targets: 256
      target_switch_duration_s: 5.0
      target_offset: 8
      total_rate_bps: 1000000
      target_selection: random
      traffic_distribution: uniform
      attack_start_s: 1.0

  scheduling:
    simulation_duration_s: 60.0

# 11/16追記 
# コメントマークがついているASは被害ASまでの経路に背景トラフィックが存在しない経路があったので、
# 実際のトラフィック取得ではコメントに書かれたASに書き換える
attacker_nodes:
  - network_address: 2.56.156.1
    as_number: AS15401
  - network_address: 122.144.64.1
    as_number: AS18396 # AS8220
  - network_address: 147.241.48.1
    as_number: AS228 # AS293
  - network_address: 144.203.128.1
    as_number: AS1311 
  - network_address: 212.110.128.1
    as_number: AS5593 # 12507

target_server_nodes:
  - network_address: 1.178.112.3
    as_number: AS12975
